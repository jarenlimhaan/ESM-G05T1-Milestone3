name: Helm Validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/k8s-validate.yml"

jobs:
  kubeconform:
    name: kubeconform (rendered)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Render Helm charts
        run: |
          mkdir -p /tmp/rendered
          helm template odoo-private helm/odoo \
            --values helm/odoo/values.yaml \
            --values helm/odoo/prd-odoo-private.yaml \
            > /tmp/rendered/odoo-private.yaml
          helm template odoo-public helm/odoo \
            --values helm/odoo/values.yaml \
            --values helm/odoo/prd-odoo-public.yaml \
            > /tmp/rendered/odoo-public.yaml
          helm template moodle helm/moodle \
            --values helm/moodle/values.yaml \
            --values helm/moodle/prd-moodle.yaml \
            > /tmp/rendered/moodle.yaml
          helm template osticket helm/osticket \
            --values helm/osticket/values.yaml \
            --values helm/osticket/prd-osticket.yaml \
            > /tmp/rendered/osticket.yaml

      - name: Validate manifests with kubeconform
        run: |
          find /tmp/rendered -name "*.yaml" | \
            xargs kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary

      - name: Check HPA minReplicas >= 1
        run: |
          failed=0
          while IFS= read -r file; do
            while IFS= read -r val; do
              if [ "$val" -lt 1 ] 2>/dev/null; then
                echo "::error file=${file}::minReplicas is ${val} — must be >= 1"
                failed=1
              fi
            done < <(grep 'minReplicas:' "$file" | awk '{print $2}')
          done < <(find /tmp/rendered -name "*.yaml" | xargs grep -l 'kind: HorizontalPodAutoscaler' 2>/dev/null)
          exit $failed
