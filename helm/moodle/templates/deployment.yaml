apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: moodle
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelay }}
            timeoutSeconds: 5
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelay }}
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          env:
            - name: MOODLE_DB_TYPE
              value: mariadb
            - name: MOODLE_DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: MOODLE_DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: MOODLE_DB_USER
              value: {{ .Values.db.user | quote }}
            - name: MOODLE_DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: MOODLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-db
                  key: password
            - name: MOODLE_ADMIN
              value: {{ .Values.moodle.adminUser | quote }}
            - name: MOODLE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-db
                  key: admin_password
            - name: MOODLE_ADMIN_EMAIL
              value: {{ .Values.moodle.adminEmail | quote }}
            - name: MOODLE_URL
              value: {{ .Values.moodle.url | quote }}
          volumeMounts:
            - name: moodle-data
              mountPath: /var/moodledata
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: moodle-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc
        {{- else }}
        - name: moodle-data
          emptyDir: {}
        {{- end }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-secrets
