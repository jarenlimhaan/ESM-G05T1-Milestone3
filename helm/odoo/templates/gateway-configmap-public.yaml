{{- if eq .Values.instance "public" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-config
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      absolute_redirect off;
      port_in_redirect off;

      # Whitelist: only static Odoo asset paths are forwarded to the backend.
      # All other routes return 403 to prevent unauthenticated access to Odoo
      # admin pages, RPC endpoints, and login forms on the public ALB.
      # Requests arrive from the ALB with the /odoo prefix intact.

      location ^~ /odoo/web/assets/ {
        rewrite ^/odoo(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_pass http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc.cluster.local;
      }

      location ^~ /odoo/web/static/ {
        rewrite ^/odoo(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_pass http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc.cluster.local;
      }

      location ^~ /odoo/web/image/ {
        rewrite ^/odoo(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_pass http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc.cluster.local;
      }

      location ^~ /odoo/web/content/ {
        rewrite ^/odoo(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_pass http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc.cluster.local;
      }

      location / {
        return 403;
      }
    }
{{- end }}
